<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>恩希 SKU 健康管理系統</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, "PingFang TC", "Microsoft JhengHei",
          system-ui, sans-serif;
        background: linear-gradient(160deg, #0f766e 0%, #134e4a 100%);
        color: #fff;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: 40px 28px;
        max-width: 480px;
        width: 100%;
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.6rem;
        line-height: 1.4;
      }
      .status {
        margin: 0;
        font-size: 1.05rem;
        opacity: 0.95;
      }
      .badge {
        display: inline-block;
        margin-top: 24px;
        padding: 6px 14px;
        font-size: 0.8rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>恩希 SKU 健康管理系統</h1>
      <p class="status">系統建置中 ✅ 部署成功</p>
      <span class="badge">Cloudflare Workers · 最小可運行版</span>
    </main>
  </body>
</html>
