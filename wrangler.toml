name = "enxi-listing-tool"
compatibility_date = "2025-01-01"
main = "worker/index.js"

# 部署前自己跑 build，確保一定有 dist。
[build]
command = "npm install && npm run build"

# 前端靜態網站（dist），同時提供 ASSETS 綁定給 Worker 取用。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 雲端商品儲存（共用）：在 Cloudflare 後台建立一個 KV namespace，
# 把它的 id 填到下面 id="" 裡，重新部署後就會啟用雲端同步。
# 在 id 還沒填好之前，先把這三行維持註解，前端會自動用「本機暫存」。
# [[kv_namespaces]]
# binding = "PRODUCTS"
# id = ""
