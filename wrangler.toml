name = "enxi-listing-tool"
compatibility_date = "2025-01-01"
main = "worker/index.js"

# 部署前自己跑 build，確保一定有 dist。
[build]
command = "npm install && npm run build"

# 前端靜態網站（dist），同時提供 ASSETS 綁定給 Worker 取用。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 白牌九圖：AI 分析每月額度上限（新台幣）。用滿就鎖，下月 1 號自動重置。
[vars]
ANALYZE_MONTHLY_BUDGET_TWD = "300"

# 雲端商品儲存（共用）：KV namespace 綁定為 PRODUCTS。
[[kv_namespaces]]
binding = "PRODUCTS"
id = "af6fb945695b441f8613afbca2673151"
