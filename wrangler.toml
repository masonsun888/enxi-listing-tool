# 恩希 SKU 健康管理系統 — 最小版部署設定
name = "enxi-sku"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# 靜態首頁（public/index.html），同時把 ASSETS 綁定給 Worker 使用。
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 資料庫。
# database_id 會在執行 `wrangler d1 create enxi-sku` 之後自動填入。
[[d1_databases]]
binding = "DB"
database_name = "enxi-sku"
database_id = "PLACEHOLDER_RUN_D1_CREATE"
